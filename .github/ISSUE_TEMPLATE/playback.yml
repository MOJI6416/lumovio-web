name: A file doesn't play
description: Your own file from Jellyfin, Plex or TorrServer won't play, plays without sound or picture, or stutters.
labels: [playback]
body:
  - type: markdown
    attributes:
      value: Never share a server address with a password, a token or an API key in it — this issue is public.
  - type: dropdown
    id: server
    attributes:
      label: Server
      options:
        - Jellyfin
        - Plex
        - TorrServer
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server version
      placeholder: Jellyfin 10.11 · TorrServer MatriX.147
  - type: input
    id: device
    attributes:
      label: Browser, system and device
      placeholder: Chrome 140 on Windows 11 · Safari on an iPhone 15 · the Android TV app on a TCL G07
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: The file
      description: Its container, video and audio codecs and subtitles — the output of `ffprobe -hide_banner <file>` or the server's media info.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What the player showed
      description: The message, how far it got, which audio track or source you picked.
    validations:
      required: true
