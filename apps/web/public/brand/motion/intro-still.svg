<svg xmlns="http://www.w3.org/2000/svg" class="lm-art lm-splash" width="683" height="292" viewBox="-96 -90 683 292" role="img" aria-label="Lumovio"><title>Lumovio</title><style>/* Light motion masters. SVGs share the approved paths from src/lib/brand.ts. */
.lm-art {
  --lm-mark: #dcfa63;
  --lm-type: #f5f6f8;
  --lm-success: #34d399;
  --lm-muted: #b4b9c4;
  --lm-action-duration: 280ms;
  --lm-offline-duration: 320ms;
  --lm-intro-duration: 2400ms;
  --lm-compact-duration: 900ms;
  --lm-loader-duration: 1600ms;
  --lm-saved-duration: 320ms;
  --lm-ease: cubic-bezier(0.22, 1, 0.36, 1);
  display: block;
  overflow: visible;
}
.lm-art[data-theme="light"] {
  --lm-mark: #0b0c10;
  --lm-type: #0b0c10;
  --lm-success: #0f9d6a;
  --lm-muted: #4a505c;
}
.lm-mark {
  fill: var(--lm-mark);
}
.lm-type {
  fill: var(--lm-type);
}
.lm-beam {
  fill: var(--lm-mark);
  opacity: 0;
}
.lm-splash .lm-mark-move {
  animation: lm-mark-home var(--lm-intro-duration) var(--lm-ease) both;
}
.lm-splash .lm-projector {
  transform-origin: 16px 56px;
  animation: lm-projector-on var(--lm-intro-duration) var(--lm-ease) both;
}
.lm-splash .lm-screen {
  transform-origin: 33px 56px;
  animation: lm-screen-open var(--lm-intro-duration) var(--lm-ease) both;
}
.lm-splash .lm-word-reveal {
  transform-origin: 132px 56px;
  animation: lm-word-reveal var(--lm-intro-duration) var(--lm-ease) both;
}
.lm-splash .lm-light {
  transform-origin: 28px 56px;
  opacity: 0;
  animation: lm-light-pass var(--lm-intro-duration) ease-in-out both;
}
@keyframes lm-mark-home {
  0%,
  30% {
    transform: translateX(189.5px);
  }
  60%,
  100% {
    transform: translateX(0);
  }
}
@keyframes lm-projector-on {
  0%,
  6% {
    opacity: 0;
    transform: scaleY(0.68);
  }
  19%,
  100% {
    opacity: 1;
    transform: scaleY(1);
  }
}
@keyframes lm-screen-open {
  0%,
  13% {
    opacity: 0;
    transform: scaleX(0.04);
  }
  34%,
  100% {
    opacity: 1;
    transform: scaleX(1);
  }
}
@keyframes lm-word-reveal {
  0%,
  37% {
    transform: scaleX(0);
  }
  72%,
  100% {
    transform: scaleX(1);
  }
}
@keyframes lm-light-pass {
  0%,
  20% {
    opacity: 0;
    transform: scaleX(0.04);
  }
  38% {
    opacity: 0.18;
  }
  60% {
    opacity: 0.1;
    transform: scaleX(1);
  }
  80%,
  100% {
    opacity: 0;
    transform: scaleX(1);
  }
}
.lm-compact .lm-projector {
  transform-origin: 18px 64px;
  animation: lm-compact-projector var(--lm-compact-duration) var(--lm-ease) both;
}
.lm-compact .lm-screen {
  transform-origin: 38px 64px;
  animation: lm-compact-screen var(--lm-compact-duration) var(--lm-ease) both;
}
@keyframes lm-compact-projector {
  0% {
    opacity: 0;
    transform: scaleY(0.8);
  }
  38%,
  100% {
    opacity: 1;
    transform: scaleY(1);
  }
}
@keyframes lm-compact-screen {
  0%,
  12% {
    opacity: 0;
    transform: scaleX(0.04);
  }
  82%,
  100% {
    opacity: 1;
    transform: scaleX(1);
  }
}
.lm-loader .lm-projector {
  animation: lm-source-breathe var(--lm-loader-duration) ease-in-out infinite;
}
.lm-loader .lm-screen {
  animation: lm-screen-breathe var(--lm-loader-duration) ease-in-out infinite;
}
.lm-loader .lm-beam {
  transform-origin: 38px 64px;
  animation: lm-light-breathe var(--lm-loader-duration) ease-in-out infinite;
}
@keyframes lm-source-breathe {
  0%,
  100% {
    opacity: 0.6;
  }
  24%,
  38% {
    opacity: 1;
  }
  64% {
    opacity: 0.7;
  }
}
@keyframes lm-screen-breathe {
  0%,
  100% {
    opacity: 0.4;
  }
  48%,
  62% {
    opacity: 1;
  }
}
@keyframes lm-light-breathe {
  0%,
  14%,
  82%,
  100% {
    opacity: 0;
    transform: scaleX(0.16);
  }
  44% {
    opacity: 0.2;
    transform: scaleX(1);
  }
  62% {
    opacity: 0;
    transform: scaleX(1);
  }
}
.lm-saved {
  color: var(--lm-success);
}
.lm-saved .lm-check {
  stroke-dasharray: 1;
  stroke-dashoffset: 0;
  animation: lm-check-draw var(--lm-saved-duration) var(--lm-ease) both;
}
.lm-saved .lm-check-ring {
  transform-origin: 32px 32px;
  animation: lm-ring-in var(--lm-saved-duration) var(--lm-ease) both;
}
@keyframes lm-check-draw {
  from {
    stroke-dashoffset: 1;
  }
  to {
    stroke-dashoffset: 0;
  }
}
@keyframes lm-ring-in {
  from {
    opacity: 0;
    transform: scale(0.9);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
.lm-action {
  --lm-action-fill-opacity: 0.16;
  color: var(--lm-mark);
}
.lm-action.lm-like {
  --lm-action-duration: 240ms;
}
.lm-action.lm-rating {
  --lm-action-duration: 320ms;
  --lm-action-fill-opacity: 1;
}
.lm-action .lm-action-glyph {
  transform-origin: 12px 12px;
  animation: lm-action-settle var(--lm-action-duration) var(--lm-ease) both;
}
.lm-action .lm-action-outline {
  stroke-dasharray: 1;
  stroke-dashoffset: 0;
  animation: lm-action-draw var(--lm-action-duration) var(--lm-ease) both;
}
.lm-action .lm-action-fill {
  opacity: var(--lm-action-fill-opacity);
  animation: lm-action-fill var(--lm-action-duration) ease-out both;
}
@keyframes lm-action-settle {
  0% {
    transform: scale(0.94);
  }
  60% {
    transform: scale(1.04);
  }
  100% {
    transform: scale(1);
  }
}
@keyframes lm-action-draw {
  from {
    stroke-dashoffset: 1;
  }
  to {
    stroke-dashoffset: 0;
  }
}
@keyframes lm-action-fill {
  from {
    opacity: 0;
  }
  to {
    opacity: var(--lm-action-fill-opacity);
  }
}
/* offline:start — this subset is also embedded into the service worker's offline HTML. */
.lm-offline {
  --lm-offline-duration: 320ms;
  display: block;
}
.lm-offline .lm-projector,
.lm-offline .lm-screen {
  fill: var(--lm-muted);
  animation: lm-projector-off var(--lm-offline-duration) ease-out both;
}
.lm-offline .lm-beam {
  fill: var(--lm-mark);
  opacity: 0;
  animation: lm-beam-off var(--lm-offline-duration) ease-out both;
}
@keyframes lm-projector-off {
  from {
    fill: var(--lm-mark);
  }
  to {
    fill: var(--lm-muted);
  }
}
@keyframes lm-beam-off {
  from {
    opacity: 0.2;
  }
  to {
    opacity: 0;
  }
}
/* offline:end */
/* Manual review switch and the OS preference have the same static fallback. */
[data-reduced="true"] .lm-art *,
.lm-art[data-reduced="true"] * {
  /* biome-ignore lint/complexity/noImportantStyles: reduced motion must override all embedded animation shorthands. */
  animation: none !important;
}
@media (prefers-reduced-motion: reduce) {
  .lm-art * {
    /* biome-ignore lint/complexity/noImportantStyles: the OS accessibility preference must override embedded animations. */
    animation: none !important;
  }
}
[data-paused="true"] .lm-art * {
  animation-play-state: paused;
}

.lm-art * { animation: none !important; }
</style>
